<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Little Sprout — Montessori Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --warm-white: #FFFDF9;
    --green: #5BAD6F;
    --green-light: #A8D5B5;
    --green-dark: #3D8A52;
    --yellow: #F7C948;
    --orange: #F4845F;
    --blue: #5BA8D4;
    --purple: #9B7FD4;
    --pink: #E8789A;
    --red: #E85B5B;
    --text: #3A2E1E;
    --text-soft: #7A6A55;
    --shadow: rgba(58,46,30,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
  }

  /* FLOATING BACKGROUND SHAPES */
  .bg-shapes {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bg-shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.08;
    animation: floatShape 8s ease-in-out infinite;
  }
  .bg-shape:nth-child(1) { width:200px;height:200px;background:var(--green);top:-50px;left:-50px;animation-delay:0s; }
  .bg-shape:nth-child(2) { width:150px;height:150px;background:var(--yellow);top:20%;right:-40px;animation-delay:2s; }
  .bg-shape:nth-child(3) { width:120px;height:120px;background:var(--blue);bottom:30%;left:10%;animation-delay:4s; }
  .bg-shape:nth-child(4) { width:180px;height:180px;background:var(--pink);bottom:-60px;right:20%;animation-delay:1s; }
  @keyframes floatShape {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }

  /* HEADER */
  header {
    position: relative; z-index: 10;
    padding: 20px 24px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-family: 'Baloo 2', cursive;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--green-dark);
    display: flex; align-items: center; gap: 8px;
  }
  .logo-leaf { font-size: 1.8rem; animation: leafWiggle 3s ease-in-out infinite; }
  @keyframes leafWiggle {
    0%,100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }
  .progress-bar-wrap {
    display: flex; align-items: center; gap: 8px;
  }
  .stars-display {
    font-size: 1.1rem; font-weight: 800; color: var(--yellow);
    text-shadow: 0 1px 2px var(--shadow);
    display: flex; align-items: center; gap: 4px;
  }

  /* HOME SCREEN */
  #home-screen {
    position: relative; z-index: 5;
    padding: 0 20px 40px;
  }
  .greeting {
    text-align: center;
    padding: 10px 0 24px;
  }
  .greeting h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 2rem; font-weight: 800;
    color: var(--green-dark);
    line-height: 1.2;
  }
  .greeting p {
    font-size: 1rem; color: var(--text-soft); margin-top: 4px;
  }

  .subject-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .subject-card {
    border-radius: 28px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 6px 20px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    overflow: hidden;
    border: none;
    outline: none;
    -webkit-appearance: none;
  }
  .subject-card:active { transform: scale(0.94); box-shadow: 0 2px 8px var(--shadow); }
  .subject-card::before {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.25);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .subject-card:hover::before { opacity: 1; }
  .subject-card .card-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
  .subject-card h3 { font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 700; color: white; }
  .subject-card p { font-size: 0.75rem; color: rgba(255,255,255,0.85); margin-top: 2px; }

  .card-letters { background: linear-gradient(135deg, #9B7FD4, #C4A8F0); }
  .card-numbers { background: linear-gradient(135deg, #F4845F, #F7A67E); }
  .card-colors  { background: linear-gradient(135deg, #5BA8D4, #84C5E8); }
  .card-animals { background: linear-gradient(135deg, #5BAD6F, #8ED4A0); }
  .card-lang    { background: linear-gradient(135deg, #E8789A, #F4A0B8); grid-column: 1 / -1; padding: 20px 16px; }
  .card-lang .card-emoji { font-size: 2.5rem; }

  /* LESSON SCREEN */
  #lesson-screen {
    display: none;
    position: fixed; inset: 0;
    z-index: 100;
    background: var(--warm-white);
    flex-direction: column;
    overflow: hidden;
  }
  #lesson-screen.active { display: flex; }

  .lesson-header {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 2px solid rgba(0,0,0,0.06);
    flex-shrink: 0;
  }
  .back-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--cream);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .back-btn:active { transform: scale(0.9); }
  .lesson-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.3rem; font-weight: 700;
    flex: 1;
  }
  .lesson-progress {
    font-size: 0.85rem; color: var(--text-soft); font-weight: 600;
  }

  .lesson-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    gap: 20px;
  }

  /* CARD STYLE LESSON */
  .lesson-card {
    background: white;
    border-radius: 32px;
    padding: 32px 24px;
    text-align: center;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px var(--shadow);
    animation: cardPop 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes cardPop {
    from { transform: scale(0.8) translateY(20px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }
  .main-emoji {
    font-size: 7rem;
    display: block;
    margin-bottom: 16px;
    cursor: pointer;
    animation: emojiFloat 3s ease-in-out infinite;
    transition: transform 0.1s;
    user-select: none;
  }
  .main-emoji:active { transform: scale(1.3); }
  @keyframes emojiFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .lesson-word {
    font-family: 'Baloo 2', cursive;
    font-size: 2.8rem; font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .lesson-subtitle {
    font-size: 1rem; color: var(--text-soft); margin-top: 4px; font-weight: 600;
  }
  .translation-badge {
    display: inline-block;
    margin-top: 10px;
    background: var(--cream);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.9rem; font-weight: 700; color: var(--text-soft);
  }

  .speak-btn {
    margin-top: 16px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 12px 28px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    margin-left: auto; margin-right: auto;
    box-shadow: 0 4px 12px rgba(91,173,111,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .speak-btn:active { transform: scale(0.95); box-shadow: 0 2px 6px rgba(91,173,111,0.3); }

  /* QUIZ OPTIONS */
  .quiz-prompt {
    font-family: 'Baloo 2', cursive;
    font-size: 1.4rem; font-weight: 700;
    text-align: center;
    color: var(--text);
  }
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%; max-width: 400px;
  }
  .option-btn {
    background: white;
    border: 3px solid transparent;
    border-radius: 20px;
    padding: 20px 12px;
    font-size: 2.5rem;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--shadow);
    transition: transform 0.15s, border-color 0.2s, background 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-family: 'Nunito', sans-serif;
  }
  .option-btn span { font-size: 0.85rem; font-weight: 700; color: var(--text-soft); }
  .option-btn:active { transform: scale(0.93); }
  .option-btn.correct {
    border-color: var(--green);
    background: rgba(91,173,111,0.12);
    animation: correctPulse 0.5s ease;
  }
  .option-btn.wrong {
    border-color: var(--red);
    background: rgba(232,91,91,0.1);
    animation: wrongShake 0.4s ease;
  }
  @keyframes correctPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* FEEDBACK */
  .feedback-overlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.3);
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .feedback-box {
    background: white;
    border-radius: 32px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: popUp 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes popUp {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .feedback-emoji { font-size: 5rem; }
  .feedback-text {
    font-family: 'Baloo 2', cursive;
    font-size: 1.8rem; font-weight: 800;
    margin-top: 8px;
  }
  .feedback-text.good { color: var(--green-dark); }
  .feedback-text.try  { color: var(--orange); }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 14px;
    border-radius: 2px;
    animation: confettiFall 1.2s ease-in forwards;
    z-index: 300; pointer-events: none;
  }
  @keyframes confettiFall {
    from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    to   { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* NAV TABS */
  .lesson-tabs {
    display: flex; gap: 8px; padding: 0 20px 20px; flex-shrink: 0;
    justify-content: center;
  }
  .tab-btn {
    flex: 1; max-width: 100px;
    padding: 10px 8px;
    border-radius: 16px;
    border: 2px solid transparent;
    background: var(--cream);
    font-family: 'Nunito', sans-serif;
    font-size: 0.75rem; font-weight: 700;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .tab-btn.active {
    background: white;
    border-color: currentColor;
    color: var(--green-dark);
    box-shadow: 0 3px 10px var(--shadow);
  }

  /* COLOR GAME */
  .color-swatches {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    width: 100%; max-width: 360px;
  }
  .color-swatch {
    aspect-ratio: 1;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--shadow);
    transition: transform 0.15s;
    border: 4px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    font-weight: 800; color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  .color-swatch:active { transform: scale(0.92); }
  .color-swatch.selected { border-color: var(--text); transform: scale(1.08); }

  /* NUMBER COUNTING */
  .counting-objects {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; max-width: 300px;
  }
  .count-obj {
    font-size: 2.8rem;
    cursor: pointer;
    transition: transform 0.2s;
    animation: popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275) both;
    user-select: none;
  }
  .count-obj:nth-child(1) { animation-delay: 0.05s; }
  .count-obj:nth-child(2) { animation-delay: 0.10s; }
  .count-obj:nth-child(3) { animation-delay: 0.15s; }
  .count-obj:nth-child(4) { animation-delay: 0.20s; }
  .count-obj:nth-child(5) { animation-delay: 0.25s; }
  .count-obj:nth-child(6) { animation-delay: 0.30s; }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .count-obj.tapped { animation: bigBounce 0.4s ease; }
  @keyframes bigBounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.5); }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); }
  }
  .count-display {
    font-family: 'Baloo 2', cursive;
    font-size: 5rem; font-weight: 900;
    color: var(--text);
    line-height: 1;
  }
  .count-label { font-size: 1rem; color: var(--text-soft); font-weight: 600; }

  /* NEXT BUTTON */
  .next-btn {
    width: 100%; max-width: 400px;
    padding: 18px;
    border-radius: 24px;
    border: none;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: white;
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(91,173,111,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .next-btn:active { transform: scale(0.97); }

  /* STARS ANIMATION */
  .star-float {
    position: fixed;
    font-size: 2rem;
    pointer-events: none;
    z-index: 250;
    animation: starFloat 1.2s ease-out forwards;
  }
  @keyframes starFloat {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to   { transform: translateY(-120px) scale(0.5); opacity: 0; }
  }
</style>
</head>
<body>

<div class="bg-shapes">
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
</div>

<!-- HOME SCREEN -->
<div id="home-screen">
  <header>
    <div class="logo"><span class="logo-leaf">🌱</span> Little Sprout</div>
    <div class="stars-display">⭐ <span id="star-count">0</span></div>
  </header>
  <div class="greeting">
    <h1>Hello, little one! 👋</h1>
    <p>What shall we learn today?</p>
  </div>
  <div class="subject-grid">
    <button class="subject-card card-letters" onclick="openLesson('letters')">
      <span class="card-emoji">🔤</span>
      <h3>Letters</h3>
      <p>ABC & sounds</p>
    </button>
    <button class="subject-card card-numbers" onclick="openLesson('numbers')">
      <span class="card-emoji">🔢</span>
      <h3>Numbers</h3>
      <p>Count & tap!</p>
    </button>
    <button class="subject-card card-colors" onclick="openLesson('colors')">
      <span class="card-emoji">🎨</span>
      <h3>Colors</h3>
      <p>All the colors!</p>
    </button>
    <button class="subject-card card-animals" onclick="openLesson('animals')">
      <span class="card-emoji">🐾</span>
      <h3>Animals</h3>
      <p>Meet friends!</p>
    </button>
    <button class="subject-card card-lang" onclick="openLesson('language')">
      <span class="card-emoji">🌍</span>
      <h3>Words in Spanish</h3>
      <p>Hola! Learn simple words</p>
    </button>
  </div>
</div>

<!-- LESSON SCREEN -->
<div id="lesson-screen">
  <div class="lesson-header">
    <button class="back-btn" onclick="closeLesson()">←</button>
    <div class="lesson-title" id="lesson-title">Letters</div>
    <div class="lesson-progress" id="lesson-progress">1 / 6</div>
  </div>
  <div class="lesson-tabs" id="lesson-tabs">
    <button class="tab-btn active" onclick="setMode('explore')" id="tab-explore">🔍 Explore</button>
    <button class="tab-btn" onclick="setMode('quiz')" id="tab-quiz">🎯 Quiz</button>
  </div>
  <div class="lesson-body" id="lesson-body"></div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const DATA = {
  letters: [
    { emoji:'🍎', word:'A', sub:'is for Apple', sound:'A' },
    { emoji:'🐝', word:'B', sub:'is for Bee',   sound:'B' },
    { emoji:'🐱', word:'C', sub:'is for Cat',   sound:'C' },
    { emoji:'🐶', word:'D', sub:'is for Dog',   sound:'D' },
    { emoji:'🥚', word:'E', sub:'is for Egg',   sound:'E' },
    { emoji:'🐸', word:'F', sub:'is for Frog',  sound:'F' },
  ],
  numbers: [
    { emoji:'⭐', word:'1', sub:'One', count:1 },
    { emoji:'🌸', word:'2', sub:'Two', count:2 },
    { emoji:'🐥', word:'3', sub:'Three', count:3 },
    { emoji:'🍓', word:'4', sub:'Four', count:4 },
    { emoji:'🌟', word:'5', sub:'Five', count:5 },
    { emoji:'🦋', word:'6', sub:'Six', count:6 },
  ],
  colors: [
    { emoji:'🔴', word:'Red',    sub:'Red like an apple!',    color:'#E85B5B', swatch:'🍎' },
    { emoji:'🔵', word:'Blue',   sub:'Blue like the sky!',    color:'#5BA8D4', swatch:'🫐' },
    { emoji:'🟡', word:'Yellow', sub:'Yellow like the sun!',  color:'#F7C948', swatch:'🌟' },
    { emoji:'🟢', word:'Green',  sub:'Green like a leaf!',    color:'#5BAD6F', swatch:'🍃' },
    { emoji:'🟠', word:'Orange', sub:'Orange like a fruit!',  color:'#F4845F', swatch:'🍊' },
    { emoji:'🟣', word:'Purple', sub:'Purple like grapes!',   color:'#9B7FD4', swatch:'🍇' },
  ],
  animals: [
    { emoji:'🐶', word:'Dog',      sub:'Woof! Woof!',     sound:'Woof' },
    { emoji:'🐱', word:'Cat',      sub:'Meow! Meow!',     sound:'Meow' },
    { emoji:'🐮', word:'Cow',      sub:'Moo! Moo!',       sound:'Moo'  },
    { emoji:'🐷', word:'Pig',      sub:'Oink! Oink!',     sound:'Oink' },
    { emoji:'🦆', word:'Duck',     sub:'Quack! Quack!',   sound:'Quack'},
    { emoji:'🐸', word:'Frog',     sub:'Ribbit! Ribbit!', sound:'Ribbit'},
  ],
  language: [
    { emoji:'👋', word:'Hola',     sub:'Hello in Spanish',   en:'Hello'  },
    { emoji:'❤️', word:'Amor',     sub:'Love in Spanish',    en:'Love'   },
    { emoji:'🏠', word:'Casa',     sub:'House in Spanish',   en:'House'  },
    { emoji:'🍎', word:'Manzana', sub:'Apple in Spanish',   en:'Apple'  },
    { emoji:'🌷', word:'Flor',     sub:'Flower in Spanish',  en:'Flower' },
    { emoji:'☀️', word:'Sol',      sub:'Sun in Spanish',     en:'Sun'    },
  ]
};

const TITLES = {
  letters:'✏️ Letters & Phonics',
  numbers:'🔢 Numbers & Counting',
  colors: '🎨 Colors & Shapes',
  animals:'🐾 Animals',
  language:'🌍 Spanish Words'
};

// ─── STATE ──────────────────────────────────────────────────────────────────
let currentSubject = null;
let currentIndex = 0;
let currentMode = 'explore';
let stars = parseInt(localStorage.getItem('sprout-stars') || '0');
let countTouched = 0;

// ─── UI HELPERS ─────────────────────────────────────────────────────────────
function updateStars() {
  document.getElementById('star-count').textContent = stars;
  localStorage.setItem('sprout-stars', stars);
}

function addStar(x, y) {
  stars++;
  updateStars();
  const el = document.createElement('div');
  el.className = 'star-float';
  el.textContent = '⭐';
  el.style.left = (x - 20) + 'px';
  el.style.top  = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

function spawnConfetti() {
  const colors = ['#F7C948','#5BAD6F','#5BA8D4','#E8789A','#9B7FD4','#F4845F'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100 + 'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (0.8 + Math.random()*0.8) + 's';
    el.style.animationDelay = Math.random()*0.4 + 's';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}

function showFeedback(correct) {
  const ov = document.createElement('div');
  ov.className = 'feedback-overlay';
  ov.innerHTML = `
    <div class="feedback-box">
      <div class="feedback-emoji">${correct ? '🎉' : '💪'}</div>
      <div class="feedback-text ${correct?'good':'try'}">${correct ? 'Great job!' : 'Try again!'}</div>
    </div>`;
  document.body.appendChild(ov);
  if (correct) spawnConfetti();
  setTimeout(() => { ov.remove(); if (correct) nextItem(); }, 1200);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 0.8; utt.pitch = 1.2;
  window.speechSynthesis.speak(utt);
}

// ─── LESSON FLOW ────────────────────────────────────────────────────────────
function openLesson(subject) {
  currentSubject = subject;
  currentIndex = 0;
  currentMode = 'explore';
  document.getElementById('lesson-screen').classList.add('active');
  document.getElementById('lesson-title').textContent = TITLES[subject];
  setMode('explore');
  renderLesson();
}

function closeLesson() {
  document.getElementById('lesson-screen').classList.remove('active');
  window.speechSynthesis && window.speechSynthesis.cancel();
}

function setMode(mode) {
  currentMode = mode;
  ['explore','quiz'].forEach(m => {
    document.getElementById('tab-'+m).classList.toggle('active', m===mode);
  });
  renderLesson();
}

function nextItem() {
  const items = DATA[currentSubject];
  if (currentIndex < items.length - 1) {
    currentIndex++;
    renderLesson();
  } else {
    currentIndex = 0;
    spawnConfetti();
    showCompleteBanner();
  }
}

function showCompleteBanner() {
  const ov = document.createElement('div');
  ov.className = 'feedback-overlay';
  ov.innerHTML = `
    <div class="feedback-box" style="padding:40px 36px">
      <div class="feedback-emoji">🏆</div>
      <div class="feedback-text good">All done!</div>
      <p style="margin-top:8px;color:#7A6A55;font-size:0.95rem">You're amazing! ⭐⭐⭐</p>
      <button onclick="this.closest('.feedback-overlay').remove();closeLesson()" 
        style="margin-top:20px;background:var(--green);color:white;border:none;border-radius:20px;padding:12px 32px;font-family:Nunito,sans-serif;font-size:1rem;font-weight:800;cursor:pointer">
        Back Home 🏠
      </button>
    </div>`;
  document.body.appendChild(ov);
}

function updateProgress() {
  const items = DATA[currentSubject];
  document.getElementById('lesson-progress').textContent = `${currentIndex+1} / ${items.length}`;
}

// ─── RENDERERS ──────────────────────────────────────────────────────────────
function renderLesson() {
  updateProgress();
  const body = document.getElementById('lesson-body');
  body.innerHTML = '';
  const item = DATA[currentSubject][currentIndex];

  if (currentMode === 'explore') {
    renderExplore(body, item);
  } else {
    renderQuiz(body, item);
  }
}

function renderExplore(body, item) {
  if (currentSubject === 'numbers') {
    renderNumberExplore(body, item); return;
  }
  if (currentSubject === 'colors') {
    renderColorExplore(body, item); return;
  }

  const card = document.createElement('div');
  card.className = 'lesson-card';

  let extra = '';
  if (currentSubject === 'language') {
    extra = `<div class="translation-badge">🇬🇧 ${item.en}</div>`;
  }

  card.innerHTML = `
    <span class="main-emoji" onclick="handleEmojiTap(this, '${item.sound || item.word}', event)">${item.emoji}</span>
    <div class="lesson-word">${item.word}</div>
    <div class="lesson-subtitle">${item.sub}</div>
    ${extra}
    <button class="speak-btn" onclick="speak('${item.word}. ${item.sub}')">
      🔊 Hear it!
    </button>`;
  body.appendChild(card);

  const next = document.createElement('button');
  next.className = 'next-btn';
  next.innerHTML = 'Next ➜';
  next.onclick = nextItem;
  body.appendChild(next);
}

function handleEmojiTap(el, word, event) {
  el.style.transform = 'scale(1.4)';
  setTimeout(() => el.style.transform = '', 300);
  speak(word);
  addStar(event.clientX, event.clientY);
}

function renderNumberExplore(body, item) {
  countTouched = 0;
  const card = document.createElement('div');
  card.className = 'lesson-card';

  let objs = '';
  for (let i = 0; i < item.count; i++) {
    objs += `<span class="count-obj" onclick="tapObject(this, event)">${item.emoji}</span>`;
  }

  card.innerHTML = `
    <div class="count-display" id="cnt-display">?</div>
    <div class="count-label">Tap each ${item.sub.toLowerCase()} to count!</div>
    <div class="counting-objects" style="margin-top:16px">${objs}</div>
    <div class="lesson-subtitle" style="margin-top:16px">${item.sub} = ${item.word}</div>`;
  body.appendChild(card);

  const next = document.createElement('button');
  next.className = 'next-btn';
  next.innerHTML = 'Next ➜';
  next.onclick = nextItem;
  body.appendChild(next);
}

function tapObject(el, event) {
  el.classList.remove('tapped');
  void el.offsetWidth;
  el.classList.add('tapped');
  countTouched++;
  document.getElementById('cnt-display').textContent = countTouched;
  speak(countTouched.toString());
  addStar(event.clientX, event.clientY);
}

function renderColorExplore(body, item) {
  const card = document.createElement('div');
  card.className = 'lesson-card';
  card.innerHTML = `
    <span class="main-emoji">${item.emoji}</span>
    <div class="lesson-word" style="color:${item.color}">${item.word}</div>
    <div class="lesson-subtitle">${item.sub}</div>
    <button class="speak-btn" style="background:${item.color}" onclick="speak('${item.word}. ${item.sub}')">
      🔊 Hear it!
    </button>`;
  body.appendChild(card);

  // color-touch swatch
  const swatchWrap = document.createElement('div');
  swatchWrap.innerHTML = `<p style="text-align:center;font-weight:700;color:var(--text-soft);margin-bottom:8px">Touch the ${item.word} spot!</p>`;
  const swatch = document.createElement('div');
  swatch.style.cssText = `width:120px;height:120px;border-radius:24px;background:${item.color};margin:0 auto;cursor:pointer;box-shadow:0 6px 20px var(--shadow);display:flex;align-items:center;justify-content:center;font-size:3rem;transition:transform 0.15s`;
  swatch.textContent = item.swatch;
  swatch.onclick = (e) => { speak(item.word); addStar(e.clientX,e.clientY); swatch.style.transform='scale(1.2)'; setTimeout(()=>swatch.style.transform='',300); };
  swatchWrap.appendChild(swatch);
  body.appendChild(swatchWrap);

  const next = document.createElement('button');
  next.className = 'next-btn';
  next.innerHTML = 'Next ➜';
  next.onclick = nextItem;
  body.appendChild(next);
}

// ─── QUIZ ────────────────────────────────────────────────────────────────────
function renderQuiz(body, item) {
  const items = DATA[currentSubject];
  const correct = item;

  // pick 3 wrong options
  let pool = items.filter((_,i) => i !== currentIndex);
  pool.sort(() => Math.random()-0.5);
  const wrongs = pool.slice(0,3);
  const options = [...wrongs, correct].sort(() => Math.random()-0.5);

  const prompt = document.createElement('div');
  prompt.className = 'quiz-prompt';
  prompt.textContent = getQuizPrompt(item);
  body.appendChild(prompt);

  const grid = document.createElement('div');
  grid.className = 'options-grid';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `${opt.emoji}<span>${opt.word}</span>`;
    btn.onclick = (e) => handleQuizAnswer(btn, opt === correct, grid, e);
    grid.appendChild(btn);
  });
  body.appendChild(grid);
}

function getQuizPrompt(item) {
  const prompts = {
    letters: `Find the letter "${item.word}"!`,
    numbers: `Which group has ${item.sub}?`,
    colors:  `Can you find ${item.word}?`,
    animals: `Which animal says "${item.sound}"?`,
    language:`Which one means "${item.en}"?`
  };
  return prompts[currentSubject] || 'Which one is it?';
}

function handleQuizAnswer(btn, isCorrect, grid, event) {
  // disable all
  grid.querySelectorAll('.option-btn').forEach(b => b.onclick = null);
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  speak(isCorrect ? 'Yes! Great job!' : 'Try again!');
  if (isCorrect) addStar(event.clientX, event.clientY);
  setTimeout(() => showFeedback(isCorrect), 600);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
updateStars();
</script>
</body>
</html>
